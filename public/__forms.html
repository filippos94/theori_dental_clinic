<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Forms</title></head>
<body>
  <!-- Netlify Forms detection file. Field names must match src/components/BookingForm.tsx. Do not delete. -->
  <form name="booking" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="booking">
    <input name="bot-field">
    <input name="name"><input name="phone"><input name="email"><input name="service">
    <input name="date"><input name="time"><textarea name="message"></textarea>
    <input name="consent"><input name="language">
  </form>
</body>
</html>
